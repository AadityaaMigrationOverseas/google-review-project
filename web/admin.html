<!doctype html>
<html lang="en">
  <head>
    <!--partial:head-->
    <title>Staff dashboard · Stellar Dental Clinic</title>
    <script type="module" src="/src/pages/admin/main.ts"></script>
  </head>
  <body class="admin">
    <a class="skip-link" href="#main">Skip to main content</a>

    <div id="boot" class="admin-boot" aria-busy="true" aria-live="polite">
      <span class="btn__spinner admin-boot__spinner" aria-hidden="true"></span>
      <span class="sr-only">Loading dashboard…</span>
    </div>

    <main id="login-view" class="shell admin-login" hidden>
      <section class="card" aria-labelledby="login-title">
        <h1 id="login-title">Staff sign in</h1>
        <p class="lede">Stellar Dental Clinic review portal</p>
        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label class="field__label" for="login-email">Email</label>
            <input id="login-email" class="input" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label class="field__label" for="login-password">Password</label>
            <input id="login-password" class="input" type="password" autocomplete="current-password" required />
          </div>
          <div id="login-alert" role="alert" hidden></div>
          <button class="btn btn--primary btn--block" type="submit" id="login-btn">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">Sign in</span>
          </button>
        </form>
      </section>
    </main>

    <div id="app-view" class="admin-app" hidden>
      <header class="admin-top">
        <div class="admin-top__brand">
          <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
            <rect width="48" height="48" rx="14" fill="currentColor" />
            <path
              fill="#fff"
              d="M16.6 11.5c-4.4 0-7.6 3.6-7.6 8.4 0 3.7 1.4 6.5 2.6 9.6.9 2.4 1.4 5.3 2 8 .4 1.7 1.4 3 2.9 3 1.9 0 2.6-1.9 3.1-4.1.6-2.6 1.1-6.1 4.4-6.1s3.8 3.5 4.4 6.1c.5 2.2 1.2 4.1 3.1 4.1 1.5 0 2.5-1.3 2.9-3 .6-2.7 1.1-5.6 2-8 1.2-3.1 2.6-5.9 2.6-9.6 0-4.8-3.2-8.4-7.6-8.4-3 0-4.6 1.6-7.4 1.6s-4.4-1.6-7.4-1.6Z"
            />
          </svg>
          <span><strong>Stellar Dental</strong> <span class="admin-top__sub">Staff dashboard</span></span>
        </div>
        <div class="admin-top__user">
          <span id="user-name"></span>
          <span id="user-role" class="badge"></span>
          <button id="logout-btn" class="btn btn--sm" type="button">Sign out</button>
        </div>
      </header>
      <nav class="admin-nav" aria-label="Dashboard sections">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/reviews" data-route="reviews">Reviews</a>
        <a href="#/complaints" data-route="complaints">Complaints</a>
        <a href="#/links" data-route="links">Review links</a>
        <a href="#/users" data-route="users" data-permission="users:manage">Staff</a>
      </nav>
      <main id="main" class="admin-main" tabindex="-1"></main>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </div>
  </body>
</html>
